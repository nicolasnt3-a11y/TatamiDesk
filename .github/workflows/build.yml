name: Build TatamiDesk

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: python -m PyInstaller --onefile --windowed --name TatamiDesk --icon assets/tatamidesk.ico tatamidesk.pyw

      - name: Build setup.exe (Inno Setup)
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $Matches[1] } else { "1.0.1" }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }
          & $iscc "/DMyAppVersion=$version" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: TatamiDesk
          path: |
            dist/TatamiDesk-Setup.exe
            dist/TatamiDesk.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TatamiDesk-Setup.exe
            dist/TatamiDesk.exe
          body_path: CHANGELOG.md
